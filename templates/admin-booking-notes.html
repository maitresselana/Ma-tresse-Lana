<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Notes du rendez-vous</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#09090c;color:#f7f2ea;font-family:Arial,sans-serif}
    .shell{width:min(620px,100%);margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(60px + env(safe-area-inset-bottom))}
    .back{display:inline-flex;padding:10px 13px;border:1px solid #39313b;border-radius:999px;color:#efd49a;text-decoration:none}
    h1{margin:22px 0 6px;font:500 clamp(2.3rem,10vw,4rem) Georgia,serif;color:#efd49a}.muted{color:#aaa1a7}
    .card{margin-top:18px;padding:18px;border:1px solid rgba(180,148,230,.32);border-radius:22px;background:rgba(65,42,92,.12)}
    form{display:grid;gap:14px}label{font-size:.8rem;color:#aaa1a7}label span{display:block;margin-bottom:7px;color:#f7f2ea;font-weight:900}
    textarea{width:100%;min-height:130px;padding:13px;border:1px solid #46394f;border-radius:13px;background:#0b0b0f;color:#fff;font-size:16px;resize:vertical}
    button{padding:14px;border:0;border-radius:999px;background:linear-gradient(135deg,#d9c0ff,#9a73cb);color:#160e20;font-weight:900;font-size:1rem}
  </style>
</head>
<body>
<main class="shell">
  <a class="back" href="{{ url_for('admin_client_detail', email=booking.email, booking=booking.id) }}">← Retour</a>
  <h1>Notes</h1>
  <div class="muted">{{ booking.pseudo }} · {{ booking.start_dt.replace('T',' ') }}</div>

  <section class="card">
    <form method="post">
      <label><span>Pratiques souhaitées pour ce rendez-vous</span><textarea name="practices">{{ booking.practices or '' }}</textarea></label>
      <label><span>Notes privées pour ce rendez-vous</span><textarea name="private_notes">{{ booking.private_notes or '' }}</textarea></label>
      <label><span>Note générale sur le client</span><textarea name="client_note">{{ client_note }}</textarea></label>
      <button type="submit">Enregistrer les notes</button>
    </form>
  </section>
</main>
</body>
</html>
